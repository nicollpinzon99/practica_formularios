<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de práctica</title>
</head>
<body>
  <main>
    <h1>Registro de práctica</h1>
    <p>Prototipo de práctica: no envía ni guarda datos. Usá solo datos ficticios.</p>
    <form>
      <div>
        <label for="registro-usuario">Nombre de usuario</label>
        <input type="text" id="registro-usuario" name="registro_usuario">
      </div>

      <div>
        <label for="registro-email">Correo electrónico</label>
        <input type="email" id="registro-email" name="registro_email">
      </div>

      <div>
        <label for="registro-password">Contraseña</label>
        <input type="password" id="registro-password" name="registro_password">
      </div>

      <div>
        <label for="registro-password-confirma">Confirmar contraseña</label>
        <input type="password" id="registro-password-confirma" name="registro_password_confirma">
      </div>

      <div>
        <button type="button">Probar contacto</button>
      </div>


    </form>
  </main>
</body>
</html>
