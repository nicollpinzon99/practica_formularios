<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
   <main>
    <h1>Login de práctica</h1>
    <p>Login de práctica: no envía ni guarda datos. Usá solo datos ficticios.</p>

    <form>
      <div>
        <label for="login-correo">Correo electrónico</label>
        <input type="email" id="login-correo" name="login_correo">
      </div>

      <div>
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" name="login_password">
      </div>

      <div>
        <button type="button">Probar login</button>
      </div>
  </main>
</body>
</html>
