<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reparar</title>
</head>
<body>
  <main>
    <h1>Reparar</h1>
    <p>Reparar de práctica</p>
    <form>
      <div>
        <label for="codigo">Codigo de invitación (opcional):</label>
        <input type="text" id="codigo" name="codigo" pattern="[0-9]{4}[A-Z]" title="Formato: 0042A">
      </div>
      
      <div>
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email">

      <div>
        <button type="button">Probar inscripción</button>
      </div>
  </main>
  
</body>
</html>
