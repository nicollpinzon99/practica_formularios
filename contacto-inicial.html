<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
</head>
<body>
  <main>
    <h1>Contacto</h1>
    <p>Prototipo de práctica: no envía ni guarda datos. Usá solo datos ficticios.</p>
    <form>
      <div>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre">
      </div> 

      <div>
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email">
      </div>


      <div>
      <button type="button">Probar contacto</button>
      </div>
    </form>
  </main>
</body>
</html>
