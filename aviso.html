<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar aviso de disponibilidad</title>
</head>
<body>
<main>
  <h1>Solicitar aviso de disponibilidad</h1>
  <p>Prototipo de práctica: no envía ni guarda datos. Usa solo datos ficticios.</p>

  <form>
    <div>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>
      </div> 

      <div>
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required>
      </div>

      <div>
      <label for="libro">Título del libro:</label>
      <input type="text" id="libro" name="libro" required>
      </div>

      <div>
      <button type="button">Guardar solicitud</button>
      </div>
  </form>
</main>
</body>
</html>
